<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <linearGradient id="khqrRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="15" y="15" width="370" height="490" rx="24" fill="#ffffff" filter="url(#cardShadow)"/>
  
  <!-- Red KHQR Header -->
  <path d="M 15 39 C 15 25.745 25.745 15 39 15 L 361 15 C 374.255 15 385 25.745 385 39 L 385 85 L 15 85 Z" fill="url(#khqrRed)"/>
  
  <!-- KHQR Logo Text & Tag -->
  <g transform="translate(35, 32)">
    <!-- KHQR Text -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="1">KHQR</text>
    
    <!-- Red Header Subtitle -->
    <rect x="110" y="14" width="76" height="22" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="148" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">BAKONG</text>
  </g>
  
  <g transform="translate(305, 30)">
    <circle cx="20" cy="20" r="16" fill="#ffffff"/>
    <path d="M 14 20 L 26 20 M 20 14 L 20 26" stroke="#E11D48" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Store Name Header -->
  <text x="200" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">THREADCRAFT CO., LTD</text>
  <text x="200" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">ABA Bank • 001 888 999 (USD)</text>

  <!-- QR Outer Box -->
  <rect x="60" y="165" width="280" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- QR Pattern (Realistic Stylized KHQR Pattern) -->
  <g fill="#0f172a">
    <!-- Top-Left Corner Position Marker -->
    <rect x="80" y="185" width="60" height="60" rx="10"/>
    <rect x="88" y="193" width="44" height="44" rx="6" fill="#ffffff"/>
    <rect x="96" y="201" width="28" height="28" rx="4"/>

    <!-- Top-Right Corner Position Marker -->
    <rect x="260" y="185" width="60" height="60" rx="10"/>
    <rect x="268" y="193" width="44" height="44" rx="6" fill="#ffffff"/>
    <rect x="276" y="201" width="28" height="28" rx="4"/>

    <!-- Bottom-Left Corner Position Marker -->
    <rect x="80" y="365" width="60" height="60" rx="10"/>
    <rect x="88" y="373" width="44" height="44" rx="6" fill="#ffffff"/>
    <rect x="96" y="381" width="28" height="28" rx="4"/>

    <!-- Center KHQR / Bakong Badge -->
    <rect x="175" y="280" width="50" height="50" rx="10" fill="#ffffff"/>
    <circle cx="200" cy="305" r="18" fill="#E11D48"/>
    <text x="200" y="311" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>

    <!-- Synthetic QR Matrix Data Pixels -->
    <rect x="155" y="185" width="10" height="10" rx="2"/>
    <rect x="170" y="185" width="10" height="10" rx="2"/>
    <rect x="195" y="185" width="20" height="10" rx="2"/>
    <rect x="225" y="185" width="10" height="10" rx="2"/>
    <rect x="240" y="185" width="10" height="10" rx="2"/>

