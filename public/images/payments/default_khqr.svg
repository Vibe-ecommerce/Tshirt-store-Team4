    <rect x="110" y="290" width="10" height="20" rx="2"/>
    <rect x="130" y="280" width="20" height="10" rx="2"/>
    <rect x="130" y="300" width="10" height="15" rx="2"/>

    <rect x="80" y="320" width="15" height="15" rx="2"/>
    <rect x="105" y="320" width="20" height="10" rx="2"/>
    <rect x="135" y="325" width="25" height="10" rx="2"/>

    <rect x="80" y="345" width="30" height="10" rx="2"/>
    <rect x="120" y="345" width="15" height="10" rx="2"/>
    <rect x="145" y="340" width="15" height="15" rx="2"/>

    <!-- Right and Bottom Data Pixels -->
    <rect x="240" y="260" width="20" height="20" rx="2"/>
    <rect x="270" y="260" width="10" height="10" rx="2"/>
    <rect x="290" y="260" width="25" height="10" rx="2"/>

    <rect x="235" y="290" width="10" height="20" rx="2"/>
    <rect x="255" y="285" width="25" height="10" rx="2"/>
    <rect x="290" y="280" width="15" height="20" rx="2"/>

    <rect x="235" y="320" width="25" height="10" rx="2"/>
    <rect x="270" y="315" width="20" height="15" rx="2"/>
    <rect x="300" y="315" width="15" height="10" rx="2"/>

    <rect x="240" y="345" width="15" height="10" rx="2"/>
    <rect x="265" y="340" width="20" height="20" rx="2"/>
    <rect x="295" y="345" width="20" height="10" rx="2"/>

    <!-- Bottom Middle Data Pixels -->
    <rect x="155" y="365" width="20" height="10" rx="2"/>
    <rect x="185" y="365" width="10" height="20" rx="2"/>
    <rect x="205" y="365" width="25" height="10" rx="2"/>
    <rect x="240" y="370" width="15" height="15" rx="2"/>

    <rect x="155" y="390" width="15" height="20" rx="2"/>
    <rect x="180" y="395" width="20" height="10" rx="2"/>
    <rect x="210" y="385" width="15" height="25" rx="2"/>
    <rect x="235" y="395" width="20" height="15" rx="2"/>

    <rect x="155" y="420" width="25" height="10" rx="2"/>
    <rect x="190" y="415" width="15" height="15" rx="2"/>
    <rect x="215" y="420" width="20" height="10" rx="2"/>
    <rect x="245" y="415" width="25" height="15" rx="2"/>

    <rect x="280" y="375" width="15" height="20" rx="2"/>
    <rect x="305" y="370" width="15" height="15" rx="2"/>
    <rect x="280" y="405" width="20" height="15" rx="2"/>
    <rect x="310" y="400" width="10" height="20" rx="2"/>
