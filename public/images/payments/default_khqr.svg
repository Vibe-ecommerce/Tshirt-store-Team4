    <rect x="195" y="200" width="10" height="10" rx="2"/>
    <rect x="215" y="200" width="20" height="10" rx="2"/>

    <rect x="155" y="215" width="10" height="10" rx="2"/>
    <rect x="180" y="215" width="25" height="10" rx="2"/>
    <rect x="220" y="215" width="15" height="10" rx="2"/>
    <rect x="245" y="215" width="10" height="10" rx="2"/>

    <rect x="155" y="230" width="20" height="10" rx="2"/>
    <rect x="190" y="230" width="10" height="10" rx="2"/>
    <rect x="210" y="230" width="30" height="10" rx="2"/>

