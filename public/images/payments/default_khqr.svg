  <!-- Bottom Info Tag -->
  <rect x="60" y="458" width="280" height="32" rx="8" fill="#fff1f2"/>
  <text x="200" y="479" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#be123c" text-anchor="middle">Scan with Bakong or any Mobile Banking App</text>
</svg>
